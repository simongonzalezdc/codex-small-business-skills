on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: docker
    container:
      image: node:26-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: apt-get update && apt-get install -y shellcheck
      - name: Shellcheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" | xargs shellcheck || true
